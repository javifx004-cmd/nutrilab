    <clipPath id="fl"><path d="M222 196v58L148 372c-14 24 2 52 30 52h156c28 0 44-28 30-52l-74-118v-58z"/></clipPath>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#012419" flood-opacity=".5"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#vig)"/>
  <circle cx="256" cy="268" r="170" fill="#fff" fill-opacity=".06"/>
