    <path d="M222 196v58L148 372c-14 24 2 52 30 52h156c28 0 44-28 30-52l-74-118v-58" fill="none" stroke="url(#glass)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M204 196h104" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
