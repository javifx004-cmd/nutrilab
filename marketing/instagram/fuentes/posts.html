<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>NutriLab · Instagram</title>
<style>
@font-face { font-family: 'Jakarta'; src: url(font.woff2) format('woff2'); font-weight: 200 800; }
:root { --ink: #0b1f17; --muted: #4b6358; --brand: #059669; --brand-2: #047857; --lime: #d9f99d; --deep: #03291e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jakarta', system-ui, sans-serif; background: #777; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
.post { width: 1080px; height: 1350px; position: relative; overflow: hidden; color: var(--ink); background: #f3f7f5; }
.post.dark { color: #fff; background: radial-gradient(110% 60% at 90% 0%, #0f9b6c, transparent 60%), radial-gradient(90% 60% at 0% 100%, #0b5e44, transparent 70%), linear-gradient(160deg, #06402f, var(--deep) 70%); }
.post.mint { background: radial-gradient(90% 55% at 15% 0%, #d1fae5, transparent 70%), linear-gradient(170deg, #f0fdf7, #dff4ea); }
.post.lav { background: radial-gradient(90% 55% at 15% 0%, #ede9fe, transparent 70%), linear-gradient(170deg, #f7f5ff, #e6ebfd); }
.post.cream { background: radial-gradient(90% 55% at 85% 0%, #fef3c7, transparent 70%), linear-gradient(170deg, #fffdf6, #f3f0e4); }
.pad { position: absolute; inset: 0; padding: 84px 84px 0; }
.brand { display: inline-flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
.brand img { width: 58px; height: 58px; border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.brand span { color: var(--brand); } .dark .brand span { color: var(--lime); }
.brand small { font-weight: 600; font-size: 20px; opacity: .65; margin-left: 6px; letter-spacing: 0; }
h1 { font-size: 92px; line-height: 1.02; letter-spacing: -.035em; font-weight: 800; margin-top: 58px; }
h1 em { font-style: normal; color: var(--brand); } .dark h1 em { color: var(--lime); }
.lav h1 em { background: linear-gradient(90deg, #7c3aed, #2563eb); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-size: 34px; line-height: 1.32; margin-top: 26px; color: var(--muted); max-width: 860px; font-weight: 500; }
.dark .sub { color: rgba(255,255,255,.82); }
.pn { margin-left: -.07em; }
/* teléfono */
.phone { position: absolute; width: 470px; border-radius: 66px; padding: 15px; background: linear-gradient(145deg, #1b2b25, #050b09); box-shadow: 0 50px 90px -30px rgba(3, 41, 30, .55), inset 0 0 0 2px #2f4a40; }
.phone img { width: 100%; display: block; border-radius: 52px; aspect-ratio: 390 / 720; object-fit: cover; object-position: top; }
.card { position: absolute; border-radius: 40px; overflow: hidden; background: #f3f6f4; box-shadow: 0 50px 90px -30px rgba(3, 41, 30, .5), 0 0 0 2px rgba(3, 41, 30, .05); }
.card img { width: 100%; display: block; margin-top: -6px; }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 20px 28px; border-radius: 26px; background: #fff; color: var(--ink); font-weight: 750; font-size: 30px; box-shadow: 0 24px 50px -16px rgba(3, 41, 30, .4); }
.chip .ok { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 26px; }
.chip small { display: block; font-size: 21px; color: var(--muted); font-weight: 600; }
.foot { position: absolute; left: 84px; right: 84px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 700; }
.pill { background: var(--lime); color: var(--deep); padding: 16px 30px; border-radius: 40px; font-weight: 800; font-size: 28px; }
.dark .foot { color: rgba(255,255,255,.85); }
.swipe { font-size: 26px; font-weight: 700; opacity: .7; }
/* bocadillo de WhatsApp */
.wa { position: absolute; width: 520px; background: #dcf8c6; color: #111b21; border-radius: 28px 28px 8px 28px; padding: 26px 30px 18px; font-size: 27px; line-height: 1.35; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
.wa a { color: #027eb5; text-decoration: none; word-break: break-all; }
.wa .t { text-align: right; font-size: 19px; color: #667781; margin-top: 6px; }
.wa .who { font-size: 21px; font-weight: 700; color: #075e54; margin-bottom: 6px; }
/* lista */
.list { list-style: none; margin-top: 40px; display: grid; gap: 22px; }
.list li { font-size: 34px; font-weight: 600; padding-left: 58px; position: relative; }
.list li::before { content: '✓'; position: absolute; left: 0; top: -2px; width: 40px; height: 40px; border-radius: 50%; background: var(--lime); color: var(--deep); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
.price { font-size: 190px; font-weight: 800; letter-spacing: -.05em; line-height: 1; margin-top: 30px; }
.price small { font-size: 52px; letter-spacing: -.01em; opacity: .8; }
.big-n { position: absolute; right: 84px; top: 52px; font-size: 130px; font-weight: 800; letter-spacing: -.06em; line-height: 1; color: rgba(5, 150, 105, .12); }
.dark .big-n { color: rgba(217, 249, 157, .12); }
.kicker { display: block; margin-top: 48px; font-size: 24px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
.dark .kicker { color: var(--lime); }
.kicker + h1 { margin-top: 18px; }
</style></head>
<body>
<div id="posts"></div>
<script>
const brand = (small = '') => `<div class="brand"><img src="icon.svg" alt=""><div>Nutri<span>Lab</span>${small ? `<small>${small}</small>` : ''}</div></div>`;
const phone = (src, css) => `<div class="phone" style="${css}"><img src="img/${src}"></div>`;
const card = (src, css) => `<div class="card" style="${css}"><img src="img/${src}"></div>`;
const foot = (l, r) => `<div class="foot"><span>${l}</span>${r}</div>`;
const P = [];

// ============ PUBLICACIONES SUELTAS
P.push(['post-1-lanzamiento', 'dark', `<div class="pad">${brand()}
  <h1>Tu consulta de nutrición, <em>en el bolsillo.</em></h1>
  <p class="sub">Clientes, dietas con IA, progreso y citas. En el móvil y en el PC.</p></div>
  ${phone('client.png', 'left:40px; top:760px; width:400px; transform:rotate(-6deg)')}
  ${phone('ai-plan.png', 'right:40px; top:760px; width:400px; transform:rotate(6deg)')}
  ${phone('home.png', 'left:290px; top:680px; width:500px; z-index:2')}`]);

P.push(['post-2-ia', 'lav', `<div class="pad">${brand()}
  <h1>Una dieta completa <em>en minutos.</em></h1>
  <p class="sub">La IA parte de la ficha de tu cliente: calorías, macros, alergias y gustos. Tú revisas y la envías.</p></div>
  ${phone('ai-plan.png', 'left:300px; top:690px; width:480px')}
  <div class="chip" style="left:70px; top:880px"><span class="ok">✓</span><div>1656 kcal<small>objetivo 1690</small></div></div>
  <div class="chip" style="right:60px; top:1090px"><span class="ok" style="background:#7c3aed">✦</span><div>Sin lactosa<small>respeta sus alergias</small></div></div>`]);

P.push(['post-3-progreso', 'mint', `<div class="pad">${brand()}
  <h1>Que cada revisión <em>se note.</em></h1>
  <p class="sub">Peso, % de grasa, perímetros y fotos, con gráficas hacia el objetivo.</p></div>
  ${phone('progress.png', 'left:305px; top:650px; width:470px')}
  <div class="chip" style="right:56px; top:820px"><span class="ok">↓</span><div>−5 kg<small>en 10 semanas</small></div></div>`]);

P.push(['post-4-enlace', 'dark', `<div class="pad">${brand()}
  <h1>Su dieta, <em>en su móvil.</em></h1>
  <p class="sub">Un enlace privado por paciente. Sin descargas ni contraseñas.</p></div>
  ${phone('portal.png', 'right:70px; top:610px; width:470px')}
  <div class="wa" style="left:60px; top:720px"><div class="who">Laura · Nutricionista</div>Hola Ana 👋 Aquí tienes tu plan y tu progreso. Ábrelo cuando quieras:<br><a>javifx004-cmd.github.io/nutrilab/#/p/…</a><div class="t">10:42 ✓✓</div></div>`]);

P.push(['post-5-citas', 'cream', `<div class="pad">${brand()}
  <h1>Cada cita, <em>al calendario</em> del móvil.</h1>
  <p class="sub">iPhone, Android, Google u Outlook, con aviso previo. Y recordatorio al paciente por WhatsApp.</p></div>
  ${card('sheet-cal.png', 'left:110px; top:720px; width:860px')}`]);

P.push(['post-6-precio', 'dark', `<div class="pad">${brand()}
  <div class="kicker">Todo incluido</div>
  <div class="price">49,99 €<small>/mes</small></div>
  <ul class="list">
    <li>Clientes y dietas ilimitados</li><li>Dietas a mano y con IA*</li><li>Progreso con gráficas y fotos</li>
    <li>Enlace privado para cada paciente</li><li>Citas al calendario del móvil</li><li>Móvil, tablet y PC</li></ul></div>
  ${phone('portal.png', 'right:-40px; top:600px; width:380px; transform:rotate(8deg)')}
  ${foot('<span class="pill">14 días gratis · sin tarjeta</span>', '')}
  <div style="position:absolute;left:84px;top:1150px;font-size:30px;font-weight:700;color:rgba(255,255,255,.85)">Enlace en la bio 👆</div>
  <div style="position:absolute;left:84px;bottom:20px;font-size:17px;opacity:.55">* La IA usa tu propia clave de Claude (Anthropic), con coste aparte según el uso.</div>`]);

// ============ CARRUSEL: 5 cosas que NutriLab hace por ti
const C = 'carrusel';
P.push([`${C}-1`, 'dark', `<div class="pad">${brand()}
  <h1 style="font-size:100px;margin-top:120px">5 cosas que NutriLab<br><em>hace por ti</em></h1>
  <p class="sub">La app para nutricionistas que quieren dedicar su tiempo a la consulta, no al papeleo.</p></div>
  ${phone('home.png', 'left:305px; top:820px; width:470px')}
  ${foot('', '<span class="swipe">Desliza →</span>')}`]);
const slide = (n, cls, title, sub, visual) => P.push([`${C}-${n + 1}`, cls, `<div class="pad">${brand()}<div class="big-n">0${n}</div>
  <h1 style="font-size:84px;margin-top:70px">${title}</h1><p class="sub" style="font-size:31px">${sub}</p></div>${visual}`]);
slide(1, 'mint', 'Calcula sus <em>calorías y macros</em>', 'Con la fórmula Mifflin-St Jeor, su actividad y su objetivo. Al crear la ficha.', phone('client-ring.png', 'left:305px; top:620px; width:470px'));
slide(2, 'lav', 'Crea la dieta <em>a mano o con IA</em>', 'Cantidades, medidas caseras y recetas, sin sus alérgenos. Tú tienes la última palabra.', card('sheet-ai.png', 'left:150px; top:620px; width:780px'));
slide(3, 'mint', 'Sigue su <em>progreso</em>', 'Mediciones, fotos y gráficas en cada revisión.', phone('progress.png', 'left:305px; top:620px; width:470px'));
slide(4, 'dark', 'Le da a tu paciente <em>su propia app</em>', 'Un enlace con su dieta, su progreso y su próxima cita. Siempre actualizado.', phone('portal.png', 'left:305px; top:620px; width:470px'));
slide(5, 'cream', 'Te organiza <em>las citas</em>', 'Al calendario del móvil en un toque, con recordatorio por WhatsApp.', card('sheet-cal.png', 'left:110px; top:640px; width:860px'));
P.push([`${C}-7`, 'dark', `<div class="pad">${brand()}
  <h1 style="font-size:104px;margin-top:160px">Pruébala <em>14 días gratis.</em></h1>
  <p class="sub">Sin tarjeta. Después, 49,99 € al mes sin permanencia.</p>
  <ul class="list" style="margin-top:60px"><li>Crea tu cuenta con tu email</li><li>Añade tu primer cliente</li><li>Envíale su dieta hoy mismo</li></ul></div>
  ${foot('<span class="pill">Enlace en la bio</span>', '<span>Guárdalo para luego 🔖</span>')}`]);

// Plus Jakarta deja aire antes de «.» y «,» en tamaños grandes
const fixP = (h) => h.replace(/(<h1[^>]*>)([\s\S]*?)(<\/h1>)/g, (m, a, b, c) => a + b.replace(/([^\s>])([.,])/g, '$1<span class="pn">$2</span>') + c);
document.getElementById('posts').innerHTML = P.map(([id, cls, html]) => `<section class="post ${cls}" id="${id}">${fixP(html)}</section>`).join('');
</script>
</body></html>
