<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#1fd18a"/><stop offset=".5" stop-color="#0c9467"/><stop offset="1" stop-color="#05432f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".55" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#022c22" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/><stop offset=".6" stop-color="#d9f99d"/><stop offset="1" stop-color="#f7fee7"/>
    </linearGradient>
    <linearGradient id="j" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#012419" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#vig)"/>
  <circle cx="256" cy="262" r="176" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="256" cy="262" r="140" fill="#ffffff" fill-opacity=".06"/>
  <g filter="url(#sh)" transform="translate(256 262) scale(.86) translate(-262 -250)">
    <!-- tallo -->
    <path d="M286 178c2-30 16-52 40-66" fill="none" stroke="#bbf7d0" stroke-width="12" stroke-linecap="round"/>
    <!-- hoja -->
    <path d="M318 118c18-50 64-74 122-68-8 58-52 92-122 68z" fill="url(#leaf)"/>
    <path d="M326 114c30-22 62-40 98-52" fill="none" stroke="#4d7c0f" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    <!-- J -->
    <path d="M286 186v138c0 54-38 90-90 90-42 0-72-24-82-58" fill="none" stroke="url(#j)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
